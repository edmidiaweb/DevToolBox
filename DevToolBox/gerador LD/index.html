<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Landing Pages</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        

        <div class="control-panel">
            <div class="panel-header">
                <h2><i class="fas fa-cog"></i> Configurações</h2>
                <div class="panel-actions">
                    <button id="preview-btn" class="btn btn-secondary">
                        <i class="fas fa-eye"></i> Visualizar
                    </button>
                    <button id="export-btn" class="btn btn-primary">
                        <i class="fas fa-download"></i> Exportar HTML
                    </button>
                </div>
            </div>

            <div class="form-sections">
                
                <div class="form-section">
                    <h3><i class="fas fa-info-circle"></i> Informações Básicas</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="title">Título Principal</label>
                            <input type="text" id="title" placeholder="Ex: Transforme Sua Vida com Nosso Produto">
                        </div>
                        <div class="form-group">
                            <label for="subtitle">Subtítulo</label>
                            <input type="text" id="subtitle" placeholder="Ex: A solução que você estava procurando">
                        </div>
                        <div class="form-group">
                            <label for="description">Descrição</label>
                            <textarea id="description" rows="3" placeholder="Descreva brevemente o que você oferece..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="cta-text">Texto do Botão (CTA)</label>
                            <input type="text" id="cta-text" placeholder="Ex: Quero Começar Agora">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-image"></i> Logo</h3>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="logo-url">URL da Logo</label>
                            <input type="text" id="logo-url" placeholder="Cole a URL da imagem aqui (Ex: https://via.placeholder.com/150x50.png)">
                        </div>
                        <div class="form-group">
                            <label for="logo-position">Posição da Logo</label>
                            <select id="logo-position">
                                <option value="none">Nenhuma</option>
                                <option value="center" selected>Centralizada</option>
                                <option value="left">Esquerda</option>
                                <option value="right">Direita</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-palette"></i> Design</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="primary-color">Cor Principal</label>
                            <input type="color" id="primary-color" value="#3498db">
                        </div>
                        <div class="form-group">
                            <label for="secondary-color">Cor Secundária</label>
                            <input type="color" id="secondary-color" value="#2c3e50">
                        </div>
                        <div class="form-group">
                            <label for="background-type">Tipo de Fundo</label>
                            <select id="background-type">
                                <option value="solid">Cor Sólida</option>
                                <option value="gradient">Gradiente</option>
                                <option value="image">Imagem</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="font-family">Fonte</label>
                            <select id="font-family">
                                <option value="'Roboto', sans-serif">Roboto</option>
                                <option value="'Open Sans', sans-serif">Open Sans</option>
                                <option value="'Lato', sans-serif">Lato</option>
                                <option value="'Montserrat', sans-serif">Montserrat</option>
                                <option value="'Poppins', sans-serif">Poppins</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-star"></i> Benefícios</h3>
                    <div id="benefits-container">
                        <div class="benefit-item">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Ícone</label>
                                    <select class="benefit-icon">
                                        <option value="fas fa-check">Check</option>
                                        <option value="fas fa-star">Estrela</option>
                                        <option value="fas fa-heart">Coração</option>
                                        <option value="fas fa-shield-alt">Escudo</option>
                                        <option value="fas fa-rocket">Foguete</option>
                                        <option value="fas fa-trophy">Troféu</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Texto do Benefício</label>
                                    <input type="text" class="benefit-text" placeholder="Ex: Resultados em 30 dias">
                                </div>
                                <button type="button" class="btn btn-danger remove-benefit">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" id="add-benefit" class="btn btn-outline">
                        <i class="fas fa-plus"></i> Adicionar Benefício
                    </button>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-quote-left"></i> Testemunhos</h3>
                    <div id="testimonials-container">
                        <div class="testimonial-item">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Nome</label>
                                    <input type="text" class="testimonial-name" placeholder="Nome do cliente">
                                </div>
                                <div class="form-group">
                                    <label>Depoimento</label>
                                    <textarea class="testimonial-text" rows="2" placeholder="Depoimento do cliente..."></textarea>
                                </div>
                                <button type="button" class="btn btn-danger remove-testimonial">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" id="add-testimonial" class="btn btn-outline">
                        <i class="fas fa-plus"></i> Adicionar Testemunho
                    </button>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-envelope"></i> Contato</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="contato@exemplo.com">
                        </div>
                        <div class="form-group">
                            <label for="phone">Telefone</label>
                            <input type="tel" id="phone" placeholder="(11) 99999-9999">
                        </div>
                        <div class="form-group">
                            <label for="whatsapp">WhatsApp</label>
                            <input type="tel" id="whatsapp" placeholder="(11) 99999-9999">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="preview-container">
            <div class="preview-header">
                <h2><i class="fas fa-desktop"></i> Preview da Landing Page</h2>
                <div class="device-selector">
                    <button class="device-btn active" data-device="desktop">
                        <i class="fas fa-desktop"></i>
                    </button>
                    <button class="device-btn" data-device="tablet">
                        <i class="fas fa-tablet-alt"></i>
                    </button>
                    <button class="device-btn" data-device="mobile">
                        <i class="fas fa-mobile-alt"></i>
                    </button>
                </div>
            </div>
            <div id="preview-frame" class="preview-frame desktop">
                <iframe id="preview-iframe" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
